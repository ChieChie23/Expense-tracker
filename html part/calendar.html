<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Calendar</title>

    <link rel="stylesheet" href="/css part/calendar.css">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>

    <div class="sidebar">

        <div class="logo">
            Expense Tracker
        </div>

        <ul class="menu">
            <li><a href="/html part/dboard.html">Dashboard</a></li>
            <li><a href="/html part/expenses.html">Expenses</a></li>
            <li><a href="/html part/addExpenses.html">Add Expenses</a></li>
            <li><a href="/html part/categories.html">Categories</a></li>
            <li><a href="/html part/budget.html">Budgets</a></li>
            <li><a href="/html part/report.html">Reports</a></li>
            <li><a href="/html part/goals.html">Goals</a></li>
            <li><a href="/html part/calendar.html">Calendar</a></li>
            <li><a href="#">Settings</a></li>
        </ul>

        <div class="logout">
            <a href="#">Logout</a>
        </div>

    </div>

    <div class="main-content">

        <div class="Welcome-head">
            <h1>Calendar</h1>
            <p>Track your expenses by date!!</p>
        </div>

        <div id="calendar"></div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const calendarEl = document.getElementById('calendar');

            const calendar = new FullCalendar.Calendar(calendarEl, {

                initialView: 'dayGridMonth',

                height: '100%',

                headerToolbar: {
                    left: 'title',
                    center: 'prev,next',
                    right: 'today'
                },

                selectable: true,

                dateClick: function(info) {

                    const title = prompt("Enter Expense/Event:");

                    if(title){
                        calendar.addEvent({
                            title: title,
                            start: info.dateStr,
                            allDay: true
                        });
                    }
                },

                events: [
                    {
                        title: 'Rent ₱5000',
                        start: '2026-07-02'
                    },
                    {
                        title: 'Internet ₱1499',
                        start: '2026-07-15'
                    }
                ]
            });

            calendar.render();
        });
    </script>

</body>
</html>
