<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css part/goals.css">
</head>
<body>

    <div class="sidebar">

        <div class="logo">
            Expense Tracker
        </div>

        <ul class="menu">

            <li><a href="/html part/dboard.html">Dashboard</a></li>
            <li><a href="/html part/expenses.html">Expenses</a></li>
            <li><a href="/html part/addExpenses.html">Add Expenses</a></li>
            <li><a href="/html part/categories.html">Categories</a></li>
            <li><a href="/html part/budget.html">Budgets</a></li>
            <li><a href="/html part/report.html">Reports</a></li>
            <li><a href="/html part/goals.html">Goals</a></li>
            <li><a href="/html part/calendar.html">Calendar</a></li>
            <li><a>Settings</a></li>

        </ul>

        <div class="logout">
            <a href="#">Logout</a>
        </div>

    </div>

    <div class="main-body">
        
        <div class="top-cont">
            <p>GOALS</p>
            <button>+ ADD GOAL</button>
        </div>

        <div class="goals-cont">

            <div class="goal-slide">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-laptop"></i>
                </div>

                <div class="details-wrapper">
                    <p>New Laptop</p>
                    <p>P<span>500.00</span> / P<span>1000.00</span></p>
                    <div class="progress-bar-wrapper">
                        <div style="width: 50%;"></div>
                    </div>
                </div>

                <div class="percentage-wrapper">
                    <p>50%</p>
                </div>
            </div>

            <div class="goal-slide">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-plane-departure"></i>
                </div>

                <div class="details-wrapper">
                    <p>Vacation Trip</p>
                    <p>P<span>750.00</span> / P<span>1000.00</span></p>
                    <div class="progress-bar-wrapper">
                        <div style="width: 75%;"></div>
                    </div>
                </div>

                <div class="percentage-wrapper">
                    <p>75%</p>
                </div>
            </div>

            <div class="goal-slide">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-vault"></i>
                </div>

                <div class="details-wrapper">
                    <p>Emergency Fund</p>
                    <p>P<span>250.00</span> / P<span>1000.00</span></p>
                    <div class="progress-bar-wrapper">
                        <div style="width: 25%;"></div>
                    </div>
                </div>

                <div class="percentage-wrapper">
                    <p>25%</p>
                </div>
            </div>

        </div>
        
    </div>
</html>
