<body>

    <div class="sidebar">

        <div class="logo">

    <!--Profile part-->
     <div class="modal" id="profileModal">

        <div class="modal-content profile-modal">

            <div class="profile-header">

                <img src="/pic/palima.jpg" class="profile-pic">

                <h2>Vince Carl Palima</h2>

                <p>Expense Tracker User</p>

            </div>

            <form class="profile-form">

                <label>Full Name:</label>
                <input type="text" value="Vince Carl Palima">

                <label>Email Address:</label>
                <input type="email" value="vincecarlpalima@gmail.com">

                <label>Phone Number:</label>
                <input type="text" placeholder="+63">

                <label>Occupation:</label>
                <input type="text" placeholder="Student">

                <button type="submit">
                    Save Changes
                </button>

            </form>

        </div>

    </div>

    </body>

<script>
    const links = document.querySelectorAll(".menu a");
    const currentPage = window.location.pathname.split("/").pop();

    links.forEach(link => {
        const linkPage = link.getAttribute("href").split("/").pop();

        if (linkPage === currentPage) {
            link.classList.add("active");
        }
    });
</script>
